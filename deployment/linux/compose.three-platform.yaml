      MAIN_URL: http://10.20.30.45:4007
      FRONTEND_URL: http://10.20.30.45:4007
      NEXT_PUBLIC_BACKEND_URL: http://10.20.30.45:4007/api
      NOT_SECURED: 'true'
      PRODUCTION_ORIGIN_PROFILE: legacy-private-lan-http-v1
