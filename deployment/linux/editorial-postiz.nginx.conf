# Единственная внешняя панель — Postiz. Внутренние ключи браузеру не передаются.
server {
    listen 10.20.30.45:4007;
    server_name _;
    client_max_body_size 1m;

    location = /_editorial-owner-auth {
        internal;
        proxy_pass http://127.0.0.1:14007/api/editorial/browser-authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_set_header Host $http_host;
    }

    location = /owner-browser/ {
        return 302 /owner-browser/vnc.html?autoconnect=1&resize=scale&path=owner-browser/websockify;
    }

    location /owner-browser/ {
        # Допуск проверяет штатная сессия владельца Postiz, а не старый Hub.
        if ($http_origin !~ "^$|^http://10\.20\.30\.45:4007$") { return 403; }
        auth_request /_editorial-owner-auth;
        add_header Cache-Control no-store always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    # A bounded image is accepted only after the same Postiz owner-session check.
    # Other routes retain the ordinary 1 MiB request limit.
    location = /api/editorial/route-admin {
        client_max_body_size 15m;
        auth_request /_editorial-owner-auth;
        proxy_pass http://127.0.0.1:14007;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://127.0.0.1:14007;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
