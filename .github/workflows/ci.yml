name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Проверки читают исходники и работают только с временными тестовыми данными.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Ruff, dependencies and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Verify Dependabot dependency manifest
        run: python scripts/check_ci_dependencies.py
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Dependency compatibility
        run: python -m pip check
      - name: Build wheel and source distribution
        run: python -m build --no-isolation

  python-tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-browser.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.lock -r requirements-browser.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install Chrome and browser dependencies
        run: python -m playwright install --with-deps chrome
      - name: Create test directory
        run: python -c "from pathlib import Path; Path('.test-state').mkdir(exist_ok=True)"
      - name: Run Python and isolated browser tests
        run: python -m pytest --basetemp=.test-state/pytest --junitxml=.test-state/tests.xml --cov=max_postiz_agent --cov-report=xml:.test-state/coverage.xml -q
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-reports-${{ matrix.os }}
          path: |
            .test-state/tests.xml
            .test-state/coverage.xml
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  postgres-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: max_postiz_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d max_postiz_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Это одноразовая БД GitHub runner; production URL и секреты не используются.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-local-only@127.0.0.1:5432/max_postiz_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Create test directory
        run: python -c "from pathlib import Path; Path('.test-state').mkdir(exist_ok=True)"
      - name: Run PostgreSQL migrations, locking and reserve tests
        run: >-
          python -m pytest
          tests/test_hub_postgres.py
          tests/test_server_postgres.py
          tests/test_automatic_repair_postgres.py
          tests/test_article_reserve_preparation.py
          tests/test_hourly_reserve_controller.py
          --basetemp=.test-state/pytest-postgres
          --junitxml=.test-state/postgres.xml -q
      - name: Save PostgreSQL test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-report
          path: .test-state/postgres.xml
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  node-tests:
    name: Postiz contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/ci-node/package-lock.json
      - name: Install isolated pinned test tooling
        run: npm ci --prefix .github/ci-node --ignore-scripts --no-audit --no-fund
      - name: Run all Postiz contract suites without live services
        run: node scripts/ci_node_tests.cjs

  required:
    name: CI required
    if: always()
    needs: [quality, python-tests, postgres-tests, node-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required CI jobs did not succeed: {failed}")
          print("All required CI jobs passed.")
          PY
