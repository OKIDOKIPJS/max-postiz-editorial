version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-compatible:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /deployment/translation
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /.github/ci-node
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Версия компилятора является частью сохранённых hashes Postiz.
    ignore:
      - dependency-name: typescript
      - dependency-name: tslib
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
